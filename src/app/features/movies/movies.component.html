<div class="container page-shell">
  <header class="page-heading"><span class="eyebrow">Explore cinema</span><h1 class="page-title">Trending movies</h1><p class="page-copy">Discover audience favorites, breakout releases, and your next watchlist addition.</p></header>
  <div *ngIf="error" class="empty-state"><div class="empty-state__icon"><i class="fa-solid fa-triangle-exclamation"></i></div><h2>Movies could not be loaded</h2><p>{{error}}</p></div>
  <div *ngIf="!error" class="media-grid">
    <article *ngFor="let movie of trendMovie" class="media-card" [routerLink]="['/movieDetails', movie.id]">
      <div class="media-card__image-wrap">
        <img class="media-card__image" [src]="imgPrefix + movie.poster_path" [alt]="movie.title" loading="lazy">
        <span class="rating-badge"><i class="fa-solid fa-star"></i>{{movie.vote_average | number:'1.1-1'}}</span>
        <button class="watchlist-button" [class.is-added]="savedMovieIds.has(movie.id)" [disabled]="savedMovieIds.has(movie.id)" (click)="addToWatchlist(movie, $event)" type="button" [attr.aria-label]="savedMovieIds.has(movie.id) ? 'Already in watchlist' : 'Add to watchlist'">
          <i [class]="savedMovieIds.has(movie.id) ? 'fa-solid fa-check' : 'fa-regular fa-bookmark'"></i>
        </button>
      </div>
      <div class="media-card__body"><h2 class="media-card__title">{{movie.title}}</h2><p class="media-card__meta">{{movie.release_date || 'Release date unavailable'}}</p></div>
    </article>
  </div>
  <nav aria-label="Movie pages"><ul class="pagination-list"><li *ngFor="let page of [1,2,3,4,5]"><button class="pagination-button" (click)="getMoviesPage(page)" type="button">{{page}}</button></li></ul></nav>
</div>
